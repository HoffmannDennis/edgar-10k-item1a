[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "edgar-10k-item1a"
version = "0.1.0.dev0"
description = "Offline, provenance-aware extraction of annual filing risk factors"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dennis Hoffmann" }]
dependencies = ["pydantic>=2.13,<3"]

[project.urls]
Homepage = "https://github.com/HoffmannDennis/edgar-10k-item1a"
Source = "https://github.com/HoffmannDennis/edgar-10k-item1a"

[project.scripts]
edgar-10k-item1a = "edgar_10k_item1a.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "build>=1.6,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_10k_item1a"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools/verify_rule_sources.py", "/pyproject.toml", "/requirements-dev.txt", "/README.md", "/LICENSE", "/examples", "/docs/rules.md", "/docs/limitations.md", "/docs/source-rights.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
